name: Build APK from zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Unpacking $ZIP"
          mkdir -p _unzipped
          unzip -q "$ZIP" -d _unzipped
          PROJECT=$(dirname "$(find _unzipped -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)")
          echo "Project dir: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path '*bin/sdkmanager' | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/GlassKeys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeys-apk
          path: out/GlassKeys.apk

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Keys build ${{ github.run_number }}
          files: out/GlassKeys.apk
