
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root!"
            exit 1
          fi

          echo "Found: $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No Gradle build files found!"
            exit 1
          fi

          if [ "$(basename "$PROJECT")" = "gradlew" ]; then
            DIR=$(dirname "$PROJECT")
          else
            DIR=$(dirname "$PROJECT")
          fi

          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project found at $DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing. Using installed Gradle."
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
