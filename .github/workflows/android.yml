
name: Build Prism Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          for DIR in \
            "${ANDROID_HOME:-}" \
            "${ANDROID_SDK_ROOT:-}" \
            "/usr/local/lib/android/sdk" \
            "/opt/android-sdk"
          do
            if [ -n "$DIR" ] && [ -d "$DIR" ]; then
              SDKMANAGER=$(find "$DIR" -type f -name sdkmanager | head -n 1)

              if [ -n "$SDKMANAGER" ]; then
                echo "ANDROID_HOME=$DIR" >> "$GITHUB_ENV"
                echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
                echo "Found: $SDKMANAGER"
                exit 0
              fi
            fi
          done

          echo "ERROR: sdkmanager not found"
          exit 1

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismKeyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
